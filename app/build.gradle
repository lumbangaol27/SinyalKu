plugins {
    id 'com.android.application'
}

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'id.sinyalku.app'
    compileSdk 34

    defaultConfig {
        applicationId 'id.sinyalku.app'
        minSdk 26
        targetSdk 34
        versionCode run
        versionName "0.1.${run}"
    }

    signingConfigs {
        debug {
            // Kunci tetap supaya APK baru bisa dipasang di atas yang lama tanpa menghapus data.
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
